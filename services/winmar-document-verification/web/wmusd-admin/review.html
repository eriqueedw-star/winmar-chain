<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WMUSD Reserve Review</title><link rel="stylesheet" href="styles.css?v=review-1"><style>body{background:#f5f8ff}.review-shell{max-width:1050px;margin:32px auto;padding:0 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.top a{color:#1978ed}.panel{background:#fff;border:1px solid #dce6f5;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 8px 24px #10265312}.row{display:grid;grid-template-columns:1fr auto;gap:18px;padding:16px 0;border-bottom:1px solid #e5edf8}.row:last-child{border-bottom:0}.meta{display:grid;gap:6px}.meta small{color:#6b7d9d;word-break:break-word}.actions{display:grid;gap:8px;min-width:220px}.actions input{padding:10px;border:1px solid #dce6f5;border-radius:8px}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:#1978ed;color:#fff}.danger{background:#fff0f0;color:#a32929;border:1px solid #f0b8b8}.muted{color:#6b7d9d}@media(max-width:700px){.row{grid-template-columns:1fr}.actions{min-width:0}}
</style></head><body><main class="review-shell"><header class="top"><div><p class="muted">WMUSD TREASURY</p><h1>Reserve review</h1></div><a href="./index.html">← Treasury room</a></header><section class="panel"><div class="top"><div><h2>Pending submissions</h2><p id="status" class="muted">Loading…</p></div><button id="refresh" class="btn primary">Refresh</button></div><div id="list"></div></section></main><script>
const api='/api/wmusd/reserve-review', token=()=>sessionStorage.getItem('wmusd_id_token')||''; const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); const list=document.querySelector('#list'), status=document.querySelector('#status'); let records=[];
async function load(){try{const r=await fetch(api,{headers:{Authorization:`Bearer ${token()}`}}),j=await r.json();if(!r.ok)throw Error(j.message||j.error);records=j.reviews||[];const pending=records.filter(x=>x.status==='PENDING_REVIEW');status.textContent=`${pending.length} pending · ${records.length} total`;list.innerHTML=pending.length?pending.map((x,i)=>`<article class="row" data-id="${esc(x.reviewId)}"><div class="meta"><b>${esc(x.reviewId)}</b><small>${esc(x.attestation?.name)} · ${esc(x.bank?.name)}</small><small>Attestation SHA-256: ${esc(x.attestation?.sha256)}</small><small>Bank SHA-256: ${esc(x.bank?.sha256)}</small></div><div class="actions"><input class="capacity" type="number" min="0" max="100000000" placeholder="Capacity WMUSD"><button class="btn primary approve">Approve</button><button class="btn danger reject">Reject</button></div></article>`).join(''):'<p class="muted">No pending submissions.</p>'}catch(e){status.textContent=`Review unavailable: ${e.message}`}}
list.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const row=b.closest('.row'), id=row.dataset.id, decision=b.classList.contains('approve')?'APPROVED':'REJECTED';b.disabled=true;try{const r=await fetch(`${api}/${id}/decision`,{method:'POST',headers:{Authorization:`Bearer ${token()}`,'content-type':'application/json'},body:JSON.stringify({decision,capacityWmusd:row.querySelector('.capacity').value||0})});const raw=await r.text();let j={};try{j=raw?JSON.parse(raw):{};}catch{throw Error(r.ok?'Invalid API response':'API returned HTML instead of JSON. Check the reserve-review proxy route.');}if(!r.ok)throw Error(j.message||j.error||'Decision failed');if(decision==='REJECTED'){row.remove();status.textContent='Rejected submission removed from the active queue.';}await load();}catch(error){status.textContent=`Decision failed: ${error.message}`;b.disabled=false;}});document.querySelector('#refresh').onclick=load;load();
</script></body></html>
