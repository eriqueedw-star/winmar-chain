<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WMUSD Mainnet Deployment</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 20px;color:#102044;background:#f7f9fd}.card{background:#fff;border:1px solid #dbe4f2;border-radius:18px;padding:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{padding:12px;background:#f1f5fb;border-radius:9px}.label{font-size:12px;color:#64748b}.value{font-weight:700;word-break:break-all;margin-top:4px}button{padding:13px 18px;border:0;border-radius:9px;background:#146ef5;color:#fff;font-weight:700;margin-top:20px;cursor:pointer}.warn{color:#a15c00}.ok{color:#087f5b}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="card"><h1>WMUSD Mainnet Deployment</h1><p>Review parameter kontrak sebelum deployment. Minting aktif tetapi kontrak dimulai dalam kondisi paused.</p><div id="params" class="grid"></div><button id="deploy" disabled>Deploy WMUSD &amp; sign</button><p id="status" class="warn">Contract source belum selesai compile untuk mainnet. Jangan sign dulu.</p></main><script>fetch('../wmusd-mainnet-deployment.json').then(r=>r.json()).then(c=>{const rows=[['Network','Winmar Chain · '+c.chainId],['Token',c.name+' ('+c.symbol+') · '+c.decimals+' decimals'],['Mint cap','100,000,000 WMUSD'],['Minting','Enabled'],['Initial state','Paused'],['Admin multisig',c.admin],['Minter',c.minter],['Burner',c.burner],['Pauser',c.pauser],['Oracle',c.oracle]];document.querySelector('#params').innerHTML=rows.map(([a,b])=>'<div class="item"><div class="label">'+a+'</div><div class="value">'+b+'</div></div>').join('')}).catch(()=>document.querySelector('#status').textContent='Config tidak dapat dimuat.');</script></body></html>
