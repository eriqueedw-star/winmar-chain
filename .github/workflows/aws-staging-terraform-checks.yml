name: AWS staging Terraform checks

on:
  pull_request:
    paths:
      - "infra/aws-staging/**"
      - "infra/developer-auth/**"
      - "scripts/build-developer-auth-lambda.sh"
      - ".github/workflows/aws-staging-terraform-checks.yml"
  push:
    branches:
      - "feature/**"
    paths:
      - "infra/aws-staging/**"
      - "infra/developer-auth/**"
      - "scripts/build-developer-auth-lambda.sh"
      - ".github/workflows/aws-staging-terraform-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-validation:
    name: Validate private AWS staging Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/aws-staging/terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.4
      - name: Terraform formatting
        run: terraform fmt -check -recursive
      - name: Terraform provider initialization (no backend, no AWS credentials)
        run: terraform init -backend=false -input=false -no-color
      - name: Validate Terraform syntax and references
        run: terraform validate -no-color

  developer-auth-validation:
    name: Validate unprovisioned developer-auth stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/developer-auth
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/developer-auth/function/package-lock.json
      - name: Build Lambda bundle without AWS credentials
        working-directory: .
        run: bash scripts/build-developer-auth-lambda.sh
      - name: Install pinned Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.4
      - name: Terraform formatting
        run: terraform fmt -check -recursive
      - name: Terraform provider initialization (no backend, no AWS credentials)
        run: terraform init -backend=false -input=false -no-color
      - name: Validate Terraform syntax and references
        run: terraform validate -no-color
