name: Ecosystem contract transaction tests

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    paths:
      - "contracts/**"
      - "tests/contracts.test.cjs"
      - ".github/workflows/ecosystem-contract-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-evm:
    name: Exercise Faucet, WMC-20, Bridge and Document Registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install explicit test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund --package-lock=false ethers@6.15.0 solc@0.8.30 ganache@7.9.2

      - name: Run in-memory EVM transaction tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/contracts.test.cjs

      - name: Verify offline test mode
        run: echo "Only in-memory Ganache was used; no mainnet signing keys or on-chain transactions."
