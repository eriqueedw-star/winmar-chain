name: Bridge readiness and security evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-readiness:
    name: Check public bridge transport
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inspect bridge and public endpoints
        shell: bash
        run: |
          set -o pipefail
          printf 'source_commit=%s\n' "$GITHUB_SHA" | tee bridge-readiness-evidence.txt
          python3 scripts/bridge-readiness-evidence.py | tee -a bridge-readiness-evidence.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bridge-readiness-evidence-${{ github.run_id }}
          path: bridge-readiness-evidence.txt
          if-no-files-found: warn
          retention-days: 30
