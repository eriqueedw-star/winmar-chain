name: Publish Winmar developer tools

on:
  pull_request:
    paths:
      - '.github/workflows/website-publish.yml'
  push:
    branches: [main]
    paths:
      - 'apps/developer-tools/**'
      - 'apps/token-creator/**'
      - 'config/**'
      - 'assets/**'
      - 'discovery/**'
      - 'integrations/wallets/status.json'
      - 'scripts/build-discovery-health.mjs'
      - '.github/workflows/website-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winmar-developer-tools-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static developer tools site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate UI and configuration
        run: python scripts/check-ecosystem-ui.py

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp apps/developer-tools/index.html _site/developers.html
          cp apps/developer-tools/wmc.html _site/wmc.html
          cp apps/developer-tools/integrations.html _site/integrations.html
          cp apps/developer-tools/wint.html _site/wint.html
          mkdir -p _site/token-creator _site/assets _site/integrations _site/discovery _site/.well-known
          cp apps/token-creator/index.html _site/token-creator/index.html
          cp -R config _site/config
          cp integrations/wallets/status.json _site/integrations/status.json
          cp discovery/chain.json _site/discovery/chain.json
          cp discovery/wallet-metadata.json _site/discovery/wallet-metadata.json
          cp discovery/eip3085.json _site/discovery/eip3085.json
          cp discovery/logo-manifest.json _site/discovery/logo-manifest.json
          cp discovery/security.txt _site/.well-known/security.txt
          cp discovery/chain.json _site/.well-known/chain.json
          cp discovery/wallet-metadata.json _site/.well-known/wallet-metadata.json
          mkdir -p _site/logo
          if [[ -f assets/wmc.png ]]; then cp assets/wmc.png _site/logo/wmc.png; fi
          if [[ -f assets/wint.png ]]; then cp assets/wint.png _site/logo/wint.png; fi
          if [[ -f winmar-chain-logo-framed-v2.png ]]; then cp winmar-chain-logo-framed-v2.png _site/assets/winmar-chain-logo-framed-v2.png; fi
          node scripts/build-discovery-health.mjs
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
