name: Organization Document Verification API checks

on:
  pull_request:
    paths:
      - 'services/winmar-document-verification/organization-api/**'
      - '.github/workflows/organization-document-api-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  organization-api:
    name: Node syntax and isolated organization proof tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/winmar-document-verification/organization-api
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confirm Node 22 or newer
        run: |
          node --version
          node -e 'if (+process.versions.node.split(".")[0] < 22) process.exit(1)'
      - name: Check server code syntax
        run: npm run check
      - name: Test tenant separation, permissions and paid on-chain proofs
        run: npm test
      - name: Fail on unexpected uploaded PDF or API key artifacts
        run: |
          if find . -type f \( -name '*.pdf' -o -name '*.pem' -o -name '*.key' -o -name 'state.json' -o -name '.env' \) | grep .; then
            echo 'Confidential/fixture artifact unexpectedly committed'
            exit 1
          fi
