name: Production hosting configuration discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect repository-only hosting hints
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/production-hosting-discovery.py | tee hosting-discovery-evidence.json
      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosting-discovery-evidence-${{ github.run_id }}
          path: hosting-discovery-evidence.json
          if-no-files-found: warn
          retention-days: 30
