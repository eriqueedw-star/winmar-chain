name: CSP enforcement readiness evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Capture public CSP readiness evidence
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/csp-enforcement-readiness.py | tee csp-readiness-evidence.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: csp-readiness-evidence-${{ github.run_id }}
          path: csp-readiness-evidence.json
          if-no-files-found: warn
          retention-days: 30
