name: Faucet relayer authorization checks

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    paths:
      - "services/faucet-relayer/**"
      - ".github/workflows/faucet-relayer-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-authorization:
    name: Wallet challenge and replay-prevention tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install test dependencies
        working-directory: services/faucet-relayer
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Validate local staging Compose syntax
        env:
          WMC_STAGING_REDIS_PASSWORD: CI_ONLY_DUMMY_VALUE
        run: docker compose -f infra/faucet-staging/compose.yaml config --quiet

      - name: Run offline wallet authorization and real Redis atomicity tests
        working-directory: services/faucet-relayer
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379
        run: |
          node --check core.cjs
          node --check server.cjs
          node --check edge.cjs
          node --check tests/staging-smoke.test.cjs
          npm test
