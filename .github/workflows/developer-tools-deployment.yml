name: Mainnet developer tools deployment

on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Select the reviewed component to deploy'
        required: true
        default: 'token-factory'
        type: choice
        options:
          - token-factory
          - all
      confirm:
        description: 'Type DEPLOY_TOKEN_FACTORY for token-factory, or DEPLOY_ALL for all components'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: winmar-mainnet-developer-tools
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy reviewed developer tools to Winmar Chain mainnet
    if: ${{ (inputs.component == 'token-factory' && inputs.confirm == 'DEPLOY_TOKEN_FACTORY') || (inputs.component == 'all' && inputs.confirm == 'DEPLOY_ALL') }}
    environment:
      name: production
      url: https://scan.winmarchain.io
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install deployment dependency
        run: npm install --no-save --ignore-scripts ethers@6.15.0

      - name: Build contract artifacts
        run: bash scripts/build-developer-tools.sh build/developer-tools

      - name: Deploy to Winmar Chain mainnet
        env:
          WINMAR_DEPLOY_TARGET: mainnet
          WINMAR_DEPLOY_COMPONENT: ${{ inputs.component }}
          WINMAR_DEPLOY_RPC_URL: https://rpc.winmarchain.io
          WINMAR_DEPLOY_RPC_BACKUP_URL: https://rpc.winmarchain.com
          WINMAR_DEPLOY_CHAIN_ID: '12142816'
          WINMAR_DEPLOY_PRIVATE_KEY: ${{ secrets.WINMAR_MAINNET_DEPLOYER_PRIVATE_KEY }}
          WINMAR_FAUCET_CLAIM_AMOUNT: '0.1'
          WINMAR_FAUCET_COOLDOWN_SECONDS: '86400'
          WINMAR_FAUCET_DAILY_CAP: '100'
          WINMAR_ARTIFACT_DIR: build/developer-tools
          WINMAR_DEPLOYMENT_OUTPUT: deployments/developer-tools.json
        run: node scripts/deploy-developer-tools.mjs

      - name: Upload deployment manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winmar-mainnet-developer-tools-${{ github.run_id }}
          path: deployments/developer-tools.json
          if-no-files-found: error
          retention-days: 90
