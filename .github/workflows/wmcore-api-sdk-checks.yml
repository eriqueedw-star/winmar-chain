name: WMCore API and SDK checks

on:
  pull_request:
    paths:
      - "services/wmcore-api/**"
      - "packages/winmarchain-sdk/**"
      - "docs/wips/**"
      - ".github/workflows/wmcore-api-sdk-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: WMCore API unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install API dependencies
        working-directory: services/wmcore-api
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Check and test API
        working-directory: services/wmcore-api
        run: |
          npm run check
          npm test

  sdk:
    name: TypeScript SDK build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install SDK dependencies
        working-directory: packages/winmarchain-sdk
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Typecheck and build SDK
        working-directory: packages/winmarchain-sdk
        run: |
          npm run check
          npm run build

  integration:
    name: SDK to API signed-action smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install API dependencies
        working-directory: services/wmcore-api
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Install and build SDK
        working-directory: packages/winmarchain-sdk
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run build
      - name: Start loopback testnet API
        run: |
          cd services/wmcore-api
          node server.cjs >/tmp/wmcore-api.log 2>&1 &
          echo $! >/tmp/wmcore-api.pid
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8790/api/v1/status >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wmcore-api.log
          exit 1
      - name: Run signed SDK smoke client
        working-directory: packages/winmarchain-sdk
        run: node examples/testnet-smoke.mjs
