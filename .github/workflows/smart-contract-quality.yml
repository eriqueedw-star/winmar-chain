name: Smart contract quality

on:
  push:
    branches:
      - main
      - "feature/**"
      - "hardening/**"
    paths:
      - "contracts/**"
      - ".github/workflows/smart-contract-quality.yml"
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/smart-contract-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile Winmar contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Compile Solidity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/winmar-solc
          mkdir -p /tmp/winmar-solc
          npx --yes solc@0.8.30 --base-path . --include-path contracts --bin --abi contracts/WinmarToken.sol contracts/WinmarTokenFactory.sol contracts/WinmarFaucet.sol -o /tmp/winmar-solc
          find /tmp/winmar-solc -maxdepth 1 -type f -name "*.bin" -print
          test "$(find /tmp/winmar-solc -maxdepth 1 -type f -name "*.bin" | wc -l)" -ge 3
          find /tmp/winmar-solc -maxdepth 1 -type f -name "*WinmarToken*" | grep -q "WinmarToken"
          find /tmp/winmar-solc -maxdepth 1 -type f -name "*WinmarTokenFactory*" | grep -q "WinmarTokenFactory"
          find /tmp/winmar-solc -maxdepth 1 -type f -name "*WinmarFaucet*" | grep -q "WinmarFaucet"
          echo "Solidity compilation passed"
