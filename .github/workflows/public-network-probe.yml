name: Public network probe

on:
  push:
    branches:
      - main
      - "hardening/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Verify public endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify Winmar Chain public network
        shell: bash
        run: bash scripts/public-network-probe.sh
