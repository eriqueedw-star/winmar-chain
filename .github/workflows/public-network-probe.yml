name: Public network probe

on:
  push:
    branches:
      - main
      - "hardening/**"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  probe:
    name: Verify public endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify Winmar Chain public network
        shell: bash
        run: |
          set -o pipefail
          printf 'source_commit=%s\n' "$GITHUB_SHA" | tee public-network-evidence.txt
          bash scripts/public-network-probe.sh | tee -a public-network-evidence.txt

      - name: Upload public-network evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-network-evidence-${{ github.run_id }}
          path: public-network-evidence.txt
          if-no-files-found: error
          retention-days: 30
