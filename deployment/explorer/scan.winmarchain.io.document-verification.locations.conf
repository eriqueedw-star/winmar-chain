# Scoped locations for the EXISTING scan.winmarchain.io HTTPS server.
# Include this file INSIDE the existing 'server { ... }' listening on 443.
# Never include in the HTTP :80 redirect server or at nginx http/global level.
#
# Keep the EXISTING Blockscout reverse-proxy location unchanged.
# These two locations only serve the reviewed static verifier UI.
#
# "current" must resolve to releases/<reviewed-commit>/site (not its parent).
# Inherit winmar-security-common.conf and winmar-csp-scan-report-only.conf
# from the HTTPS server. NO location-level add_header directives here.
#
# READ-ONLY: no wallet writes, private keys, PDF storage or backend endpoints.

location ^~ /document-verification/ {
    root /srv/winmar-document-verification/current;
    limit_except GET { deny all; }
    try_files $uri =404;
}

location ~ "^/verify/0x[0-9A-Fa-f]{64}/?$" {
    root /srv/winmar-document-verification/current;
    limit_except GET { deny all; }
    try_files /verify.html =404;
    expires -1;
}
