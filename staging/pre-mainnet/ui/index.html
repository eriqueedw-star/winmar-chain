<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WMUSD Staging Treasury Room</title>
<style>body{font-family:Arial,sans-serif;background:#071b45;color:#fff;max-width:760px;margin:40px auto;padding:24px}button{padding:14px 20px;border:0;border-radius:10px;background:#2e7df6;color:#fff;font-weight:700;cursor:pointer}section{background:#123e86;padding:24px;border-radius:18px;margin-top:20px}code{word-break:break-all}.status{line-height:1.8}</style></head>
<body><p>WINMAR CHAIN</p><h1>WMUSD Staging Treasury Room</h1><p>Pre-mainnet only · Chain ID 12142818 · minting dormant</p>
<section><label>Amount WMUSD <input id="amount" type="number" min="0" step="0.000001" value="100"></label><br><button id="connect">Connect wallet</button><button id="enable" disabled>Enable minting</button><button id="cap" disabled>Set cap</button><button id="reset" disabled>Reset cap to 0</button><button id="disable" disabled>Disable minting</button><button id="mint" disabled>Mint amount</button><p id="wallet">Wallet not connected</p><div class="status" id="status">Checking staging RPC…</div></section>
<script>
const RPC='http://127.0.0.1:28545'; const CHAIN='0xb948e2'; const CONTRACT='0x2B1a525DE96C36972ECB5D850638d8c85755E585';
async function rpc(method,params=[]){const r=await fetch(RPC,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',method,params,id:1})});return (await r.json()).result}
async function check(){try{const id=await rpc('eth_chainId');document.querySelector('#status').innerHTML=`RPC online · chain ID ${parseInt(id,16)}<br>WMUSD staging: <code>${CONTRACT}</code><br>Minting: locked · Redemption: locked · Supply: 0`}catch(e){document.querySelector('#status').textContent='RPC unavailable. Start the staging validators first.'}}
let connected='';
const capButton=document.querySelector('#cap');
const resetButton=document.querySelector('#reset');const disableButton=document.querySelector('#disable');
document.querySelector('#connect').addEventListener('click',()=>setTimeout(()=>{resetButton.disabled=disableButton.disabled=document.querySelector('#enable').disabled},300));
const toUnits=()=>{const n=Number(document.querySelector('#amount').value);if(!Number.isFinite(n)||n<0)throw new Error('Invalid WMUSD amount');return BigInt(Math.round(n*1e6))};
const adminAddress='0x0b1b6b337dfcee4e4811c8f7828e9acfc4a70716';
const minterAddress='0x0a8e959ed2488eb82ce9ec41499113c73da41975';
function syncAdmin(address){connected=address||'';const isAdmin=connected.toLowerCase()===adminAddress;const isMinter=connected.toLowerCase()===minterAddress;document.querySelector('#enable').disabled=!isAdmin;capButton.disabled=!isAdmin;resetButton.disabled=!isAdmin;disableButton.disabled=!isAdmin;document.querySelector('#mint').disabled=!isMinter;if(connected)document.querySelector('#wallet').textContent=`Connected: ${connected}`}
async function loadExistingWallet(){if(!window.ethereum)return;try{const accounts=await window.ethereum.request({method:'eth_accounts'});if(accounts[0])syncAdmin(accounts[0]);window.ethereum.on?.('accountsChanged',accounts=>syncAdmin(accounts[0]||''))}catch{} }
loadExistingWallet();
document.querySelector('#connect').addEventListener('click',()=>setTimeout(()=>{capButton.disabled=document.querySelector('#enable').disabled},250));
document.querySelector('#connect').onclick=async()=>{const out=document.querySelector('#wallet');if(!window.ethereum){out.textContent='MetaMask/SafePal extension not detected';return}try{try{await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:CHAIN}]})}catch(e){if(e.code!==4902)throw e;await window.ethereum.request({method:'wallet_addEthereumChain',params:[{chainId:CHAIN,chainName:'Winmar Pre-Minnet',nativeCurrency:{name:'Winmar Coin',symbol:'WMC',decimals:18},rpcUrls:[RPC]}]})}const [a]=await window.ethereum.request({method:'eth_requestAccounts'});connected=a;out.textContent=`Connected: ${a}`;document.querySelector('#connect').textContent='Wallet connected';document.querySelector('#enable').disabled=connected.toLowerCase()!=='0x0b1b6b337dfcee4e4811c8f7828e9acfc4a70716'}catch(e){out.textContent=e.message||'Wallet connection cancelled'}};
document.querySelector('#enable').onclick=async()=>{if(!window.ethereum||connected.toLowerCase()!=='0x0b1b6b337dfcee4e4811c8f7828e9acfc4a70716')return;const data='0x4ea3871a'+'0'.repeat(63)+'1';try{await window.ethereum.request({method:'eth_sendTransaction',params:[{from:connected,to:CONTRACT,data}]});document.querySelector('#status').innerHTML='Minting enable transaction submitted. Mint cap remains 0.'}catch(e){document.querySelector('#status').textContent=e.message||'Transaction cancelled'}}; check();
document.querySelector('#cap').onclick=async()=>{if(!window.ethereum||connected.toLowerCase()!=='0x0b1b6b337dfcee4e4811c8f7828e9acfc4a70716')return;const data='0x4070a0c9'+'0'.repeat(56)+'5f5e100';try{await window.ethereum.request({method:'eth_sendTransaction',params:[{from:connected,to:CONTRACT,data}]});document.querySelector('#status').innerHTML='Test cap transaction submitted: 100 WMUSD.'}catch(e){document.querySelector('#status').textContent=e.message||'Transaction cancelled'}}; check();
document.querySelector('#cap').onclick=async()=>{if(!window.ethereum||connected.toLowerCase()!==adminAddress)return;const data='0x4070a0c9'+(100000000n).toString(16).padStart(64,'0');try{await window.ethereum.request({method:'eth_sendTransaction',params:[{from:connected,to:CONTRACT,data}]});document.querySelector('#status').innerHTML='Test cap transaction submitted: 100 WMUSD.'}catch(e){document.querySelector('#status').textContent=e.message||'Transaction cancelled'}};
document.querySelector('#cap').onclick=async()=>{if(!window.ethereum||connected.toLowerCase()!==adminAddress)return;try{const data='0x4070a0c9'+toUnits().toString(16).padStart(64,'0');await window.ethereum.request({method:'eth_sendTransaction',params:[{from:connected,to:CONTRACT,data}]});document.querySelector('#status').textContent='Cap update submitted.'}catch(e){document.querySelector('#status').textContent=e.message||'Transaction cancelled'}};
document.querySelector('#reset').onclick=()=>{document.querySelector('#amount').value='0';document.querySelector('#cap').click()};
document.querySelector('#disable').onclick=async()=>{if(!window.ethereum||connected.toLowerCase()!==adminAddress)return;try{await window.ethereum.request({method:'eth_sendTransaction',params:[{from:connected,to:CONTRACT,data:'0x4ea3871a'+'0'.repeat(64)}]});document.querySelector('#status').textContent='Minting disable submitted.'}catch(e){document.querySelector('#status').textContent=e.message||'Transaction cancelled'}};
document.querySelector('#mint').onclick=async()=>{if(!window.ethereum||connected.toLowerCase()!==minterAddress)return;const recipient=connected.slice(2).toLowerCase().padStart(64,'0');const amount=(1000000n).toString(16).padStart(64,'0');const ref='33'.repeat(32);const data='0xb1540ffe'+recipient+amount+ref;try{await window.ethereum.request({method:'eth_sendTransaction',params:[{from:connected,to:CONTRACT,data}]});document.querySelector('#status').innerHTML='Mint test transaction submitted: 1 WMUSD.'}catch(e){document.querySelector('#status').textContent=e.message||'Transaction cancelled'}};
</script></body></html>
