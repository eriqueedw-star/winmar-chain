# Example Nginx security headers for a single HTTPS server block.
# Do not include globally or on port 80. Review existing add_header inheritance.
# Verify each site's application dependencies before enforcing a CSP.
add_header Strict-Transport-Security "max-age=300" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Report-only policy is intentionally conservative and must be tuned from browser reports.
# Set an authorized reporting endpoint separately if available.
add_header Content-Security-Policy-Report-Only "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
# Do not enable includeSubDomains or preload until every subdomain is verified.
