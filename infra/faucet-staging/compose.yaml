# WINMAR CHAIN FAUCET: LOCAL STAGING / SIMULATION ONLY
# No WMC signer or wallet funding in this stack; no public ports.
name: winmar-faucet-staging
services:
  redis:
    image: redis:7.4-alpine
    restart: "no"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --protected-mode
      - "yes"
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-staging-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  redis-staging-data:
